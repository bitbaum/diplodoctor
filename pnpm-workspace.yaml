# pnpm 11 refuses to run a dependency's build script unless it is approved here,
# and it EXITS NON-ZERO when one is unapproved — so without this file a fresh
# clone cannot install at all, and the deploy dies before it reaches the build.
#
# Both of these need their build step:
#   sharp          native image codec; next uses it for image optimisation
#   unrs-resolver  native module resolver used by eslint-config-next
#
# This lives here and not in package.json's "pnpm" field: pnpm 11 no longer
# reads that field, and ignores it with a warning — which makes the setting
# look present while doing nothing.
allowBuilds:
  sharp: true
  unrs-resolver: true
